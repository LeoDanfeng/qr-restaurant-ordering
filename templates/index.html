<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order at your table</title><link rel="stylesheet" href="/static/style.css"></head><body><header class="topbar"><div class="brand"><span class="brand-mark">R</span><div><b>Riverside Kitchen</b><small>Fresh food, made with care</small></div></div><a class="admin-link" href="/admin">Staff</a></header><main class="customer-wrap"><section class="welcome"><p class="eyebrow">WELCOME</p><h1>What sounds good?</h1><p>Browse the menu and order right from your table.</p><div id="tableBadge" class="table-badge">Choose your table</div></section><div id="categoryTabs" class="category-tabs"></div><section id="menu" class="menu-grid"></section></main><button id="cartFab" class="cart-fab" hidden>View order <span id="cartCount">0</span></button><div id="cartOverlay" class="overlay" hidden><div class="cart-panel"><div class="panel-head"><div><p class="eyebrow">YOUR ORDER</p><h2>Order summary</h2></div><button class="icon-btn" id="closeCart" aria-label="Close">×</button></div><div id="cartLines"></div><label class="field-label" for="orderNote">Note for the kitchen (optional)</label><textarea id="orderNote" placeholder="Allergies, preferences, etc."></textarea><div class="total-row"><b>Total</b><strong id="cartTotal">¥0</strong></div><button id="submitOrder" class="primary-btn">Place order</button><p id="cartMessage" class="message"></p></div></div><div id="successOverlay" class="overlay" hidden><div class="success-card"><div class="success-icon">✓</div><h2>Order received</h2><p id="successText">The restaurant has received your order.</p><button class="primary-btn" id="doneBtn">Back to menu</button></div></div><script src="/static/customer.js"></script></body></html>
